# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # local::. installs cmgdr itself: on Windows the Quarto vignette
          # render does not see the library R CMD build installs into.
          extra-packages: any::rcmdcheck, local::.
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # R CMD check against Bioconductor devel, then BiocCheck. BiocCheck ERRORs
  # fail the job; WARNINGs and NOTEs are only reported.
  bioconductor:
    runs-on: ubuntu-latest
    name: Bioconductor devel + BiocCheck
    container: bioconductor/bioconductor_docker:devel

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_LIBS_USER: /__w/_temp/R-lib

    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto if the image lacks it
        run: |
          if ! command -v quarto; then
            curl -fsSL -o /tmp/quarto.deb \
              https://github.com/quarto-dev/quarto-cli/releases/download/v1.7.32/quarto-1.7.32-linux-amd64.deb
            dpkg -i /tmp/quarto.deb
          fi
          quarto --version

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: /__w/_temp/R-lib
          key: bioc-devel-${{ hashFiles('DESCRIPTION') }}
          restore-keys: bioc-devel-

      - name: Install dependencies
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'BiocManager::install(c("BiocCheck", "rcmdcheck", "remotes"), ask = FALSE, update = FALSE)' \
                  -e 'deps <- remotes::local_package_deps(dependencies = TRUE)' \
                  -e 'BiocManager::install(deps, ask = FALSE, update = FALSE)'

      - name: R CMD check
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual", build_args = "--no-manual", error_on = "warning", check_dir = "check")'

      - name: BiocCheck
        run: |
          Rscript -e 'BiocCheck::BiocCheck(Sys.glob("check/*.tar.gz"), `new-package` = TRUE,
                                           `no-check-bioc-help` = TRUE,
                                           `quit-with-status` = TRUE)'
